name: Publish validated Numérologie v2.5

on:
  pull_request:
    branches: [main]
    paths:
      - 'publish-v25-trigger.txt'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact validated APK to Supabase Storage
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://xvwsdoqiesnqpyrqahwf.supabase.co/functions/v1/num-apk-publish-once-v25'
          OUT="$(curl -fsS -X POST "$ENDPOINT")"
          echo "$OUT"
          echo "$OUT" | grep -q '"ok":true'
          echo "$OUT" | grep -q '2f3a60b8258e420fc77c5b4b06f2efb7c00dabb750b24629221cc1375c10db6a'

      - name: Verify published bytes from public Storage
        shell: bash
        run: |
          set -euo pipefail
          URL='https://xvwsdoqiesnqpyrqahwf.supabase.co/storage/v1/object/public/app-mada-apks/Numerologie-Mada.apk'
          curl -fsSL "$URL?verify=${GITHUB_RUN_ID}" -o /tmp/Numerologie-Mada.apk
          test "$(stat -c '%s' /tmp/Numerologie-Mada.apk)" = '589401'
          ACTUAL="$(sha256sum /tmp/Numerologie-Mada.apk | awk '{print $1}')"
          test "$ACTUAL" = '2f3a60b8258e420fc77c5b4b06f2efb7c00dabb750b24629221cc1375c10db6a'
          echo "Published APK verified: $ACTUAL"
