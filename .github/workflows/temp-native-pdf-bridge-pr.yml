name: Temp PR native PDF bridge

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-native-pdf-bridge-pr.yml'
      - 'tools/native-pdf-bridge/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build bridge APK
        run: gradle -p tools/native-pdf-bridge :app:assembleRelease --no-daemon --stacktrace
      - name: Extract and verify classes.dex
        shell: bash
        run: |
          set -euo pipefail
          APK=tools/native-pdf-bridge/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -p "$APK" classes.dex > classes.dex
          test -s classes.dex
          strings classes.dex | grep -q AndroidFiles
          strings classes.dex | grep -q savePdf
          strings classes.dex | grep -q sharePdf
          sha256sum classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: numerologie-native-pdf-classes-dex
          path: classes.dex
          if-no-files-found: error
