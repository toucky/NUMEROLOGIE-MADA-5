name: Temp build native PDF bridge

on:
  push:
    branches: [temp-build-native-pdf-bridge]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create minimal Android bridge project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-pdf-bridge/app/src/main/java/com/appmada/numerologiemada

          cat > native-pdf-bridge/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'NumerologieNativePdfBridge'
          include ':app'
          EOF

          cat > native-pdf-bridge/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > native-pdf-bridge/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.appmada.numerologiemada'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.appmada.numerologiemada'
                  minSdk 23
                  targetSdk 34
                  versionCode 5
                  versionName '2.4'
              }
              buildTypes { release { minifyEnabled false } }
          }
          EOF

          cat > native-pdf-bridge/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Numérologie Mada" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > native-pdf-bridge/app/src/main/java/com/appmada/numerologiemada/MainActivity.java <<'EOF'
          package com.appmada.numerologiemada;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.addJavascriptInterface(new AndroidFiles(this), "AndroidFiles");
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/numerologie-mada.html?v=104");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              public static final class AndroidFiles {
                  private final Activity activity;
                  private final Handler main = new Handler(Looper.getMainLooper());

                  AndroidFiles(Activity activity) { this.activity = activity; }

                  @JavascriptInterface
                  public void savePdf(String base64Data, String requestedName) {
                      new Thread(() -> {
                          try {
                              SavedPdf saved = writePdf(base64Data, requestedName);
                              toast("PDF enregistré dans Téléchargements/Numérologie Mada/" + saved.name);
                          } catch (Exception e) {
                              toast("Enregistrement PDF impossible : " + safeMessage(e));
                          }
                      }).start();
                  }

                  @JavascriptInterface
                  public void sharePdf(String base64Data, String requestedName) {
                      new Thread(() -> {
                          try {
                              SavedPdf saved = writePdf(base64Data, requestedName);
                              main.post(() -> {
                                  Intent send = new Intent(Intent.ACTION_SEND);
                                  send.setType("application/pdf");
                                  send.putExtra(Intent.EXTRA_STREAM, saved.uri);
                                  send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  activity.startActivity(Intent.createChooser(send, "Partager le rapport PDF"));
                              });
                          } catch (Exception e) {
                              toast("Partage PDF impossible : " + safeMessage(e));
                          }
                      }).start();
                  }

                  private SavedPdf writePdf(String base64Data, String requestedName) throws Exception {
                      if (Build.VERSION.SDK_INT < 29) {
                          throw new IllegalStateException("Android 10 ou plus requis pour cet export direct");
                      }
                      byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                      if (bytes.length < 8 || bytes[0] != '%' || bytes[1] != 'P' || bytes[2] != 'D' || bytes[3] != 'F') {
                          throw new IllegalArgumentException("contenu PDF invalide");
                      }
                      String name = sanitize(requestedName);
                      ContentResolver resolver = activity.getContentResolver();
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, "application/pdf");
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Numérologie Mada");
                      values.put(MediaStore.MediaColumns.IS_PENDING, 1);
                      Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri == null) throw new IllegalStateException("stockage indisponible");
                      try (OutputStream out = resolver.openOutputStream(uri, "w")) {
                          if (out == null) throw new IllegalStateException("écriture impossible");
                          out.write(bytes);
                          out.flush();
                      } catch (Exception e) {
                          resolver.delete(uri, null, null);
                          throw e;
                      }
                      values.clear();
                      values.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      resolver.update(uri, values, null, null);
                      return new SavedPdf(uri, name);
                  }

                  private static String sanitize(String requestedName) {
                      String name = requestedName == null ? "Rapport-Numerologie.pdf" : requestedName.trim();
                      name = name.replaceAll("[\\\\/:*?\"<>|\\r\\n]+", "-");
                      if (name.length() == 0) name = "Rapport-Numerologie.pdf";
                      if (!name.toLowerCase().endsWith(".pdf")) name += ".pdf";
                      if (name.length() > 120) name = name.substring(0, 116) + ".pdf";
                      return name;
                  }

                  private static String safeMessage(Exception e) {
                      String s = e.getMessage();
                      return s == null || s.length() == 0 ? "erreur Android" : s;
                  }

                  private void toast(String message) {
                      main.post(() -> Toast.makeText(activity, message, Toast.LENGTH_LONG).show());
                  }

                  private static final class SavedPdf {
                      final Uri uri;
                      final String name;
                      SavedPdf(Uri uri, String name) { this.uri = uri; this.name = name; }
                  }
              }
          }
          EOF

      - name: Build bridge APK
        run: gradle -p native-pdf-bridge :app:assembleRelease --no-daemon --stacktrace

      - name: Extract and verify classes.dex
        shell: bash
        run: |
          set -euo pipefail
          APK=native-pdf-bridge/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -p "$APK" classes.dex > classes.dex
          test -s classes.dex
          strings classes.dex | grep -q AndroidFiles
          strings classes.dex | grep -q savePdf
          strings classes.dex | grep -q sharePdf
          strings classes.dex | grep -q MediaStore
          sha256sum classes.dex

      - uses: actions/upload-artifact@v4
        with:
          name: numerologie-native-pdf-classes-dex
          path: classes.dex
          if-no-files-found: error
